<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090719"><title>PulseSphere | Beta</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#f8f5ff;background:#080719}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#27105c 0,transparent 48%),#080719}header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:15px 4%;background:#0b0925eF;border-bottom:1px solid #56308d;backdrop-filter:blur(12px)}.brand{font-size:26px;font-weight:900;direction:ltr;letter-spacing:-1px}.brand span{color:#03d9fa}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.chip{background:#17112d;border:1px solid #67449c;border-radius:12px;padding:10px 13px}.nav button.active,.chip.active,.primary{background:linear-gradient(115deg,#8b26e9,#4c20b4);border:1px solid #bd60ff}.search{background:#15112b;border:1px solid #7950a6;border-radius:30px;padding:12px;color:white;min-width:180px;max-width:100%}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;max-width:1600px;margin:auto;padding:20px}.side,.panel{background:#13102b;border:1px solid #4a3375;border-radius:22px;padding:18px}.side{height:max-content;position:sticky;top:85px}.side button{display:block;width:100%;text-align:right;margin:9px 0;padding:12px;background:transparent;border:1px solid transparent;border-radius:12px}.side button:hover{background:#302052}.hero{min-height:310px;border:1px solid #7545b5;border-radius:26px;padding:55px 24px;text-align:center;background:radial-gradient(circle at 78% 40%,#0968ad88,transparent 33%),radial-gradient(circle at 15% 40%,#8e1ad877,transparent 37%),linear-gradient(135deg,#0b1035,#260a50);box-shadow:0 0 35px #8227d330}.orb{font-size:62px;filter:drop-shadow(0 0 18px #b933ff)}h1{font-size:clamp(35px,6vw,65px);margin:8px}h1 span{color:#b96dff}.hero p{color:#ddd0ff;font-size:18px}.primary{padding:13px 25px;border-radius:30px;font-weight:700}.section-title{margin:28px 0 16px;display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}.chip{white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.card{background:#15112f;border:1px solid #55398d;border-radius:18px;overflow:hidden}.poster{height:155px;display:grid;place-items:center;font-size:68px;background:radial-gradient(circle at 35% 35%,#6323b3,#071c43 65%,#080c23)}.card .body{padding:15px}.card p,.muted{color:#b9add1}.card button{border:1px solid #6f3baf;border-radius:10px;padding:8px 12px;background:#241544}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{margin-top:20px;color:#bcb1d5;font-size:13px}.hidden{display:none!important}footer{text-align:center;padding:35px;color:#9e90b7}@media(max-width:850px){header{flex-wrap:wrap}.layout{display:block;padding:12px}.side{position:static;display:flex;overflow-x:auto;gap:8px;margin-bottom:15px}.side button{white-space:nowrap;width:auto}.hero{padding:35px 15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.poster{height:120px}}@media(max-width:390px){.cards{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">Pulse<span>Sphere</span></div><div class="nav"><button class="active" data-filter="الكل">الرئيسية</button><button data-filter="أفلام">الأفلام</button><button data-filter="مسلسلات">المسلسلات</button><button data-filter="كوميديا">الكوميديا</button><button data-filter="رياضة">كرة القدم</button><button data-filter="ألعاب">الألعاب</button></div><input id="search" class="search" type="search" placeholder="ابحث عن محتوى..." aria-label="البحث"></header>
<div class="layout"><aside class="side"><button id="home">⌂ الرئيسية</button><button id="favorites">♡ المفضلة</button><button id="submit">＋ اقترح محتوى</button><button id="about">✧ حول النسخة التجريبية</button></aside><main><section class="hero"><div class="orb">🪐</div><h1>Pulse<span>Sphere</span></h1><strong>ONE WORLD. ONE PULSE.</strong><p>عالم واحد للترفيه والإبداع والاكتشاف</p><button class="primary" id="explore">اكتشف المحتوى الآن ◀</button></section><div class="section-title"><h2 id="heading">اكتشف عوالم PulseSphere</h2><span id="count" class="muted"></span></div><div class="chips" id="chips"></div><section class="cards" id="cards" aria-live="polite"></section><p class="notice">نسخة Beta تجريبية: البطاقات أمثلة توضيحية وليست مكتبة أفلام مرخصة. تُحفظ المفضلة على هذا الجهاز فقط. لا توجد أرقام مستخدمين أو أرباح مزعومة.</p></main></div><footer>PulseSphere · CONNECT • SHARE • INSPIRE</footer>
<script>
const items=[{id:1,t:'رحلة إلى المجهول',c:'أفلام',e:'🚀',d:'مغامرة خيال علمي — نموذج عرض'},{id:2,t:'عالم الأسرار',c:'قصص وألغاز',e:'🔮',d:'قصص غامضة وتحديات'},{id:3,t:'أسرار الذكاء الاصطناعي',c:'علوم',e:'🤖',d:'اكتشف أفكار التقنية'},{id:4,t:'تحديات كرة القدم',c:'رياضة',e:'⚽',d:'محتوى رياضي تجريبي'},{id:5,t:'لحظات مضحكة',c:'كوميديا',e:'🎭',d:'مواقف وكوميديا'},{id:6,t:'عوالم اللاعبين',c:'ألعاب',e:'🎮',d:'مغامرات الألعاب'},{id:7,t:'حكايات المستقبل',c:'مسلسلات',e:'📺',d:'سلسلة خيال علمي — نموذج'},{id:8,t:'أسرار الكون',c:'علوم',e:'🧪',d:'محتوى علمي واستكشافي'}];
const cats=['الكل','أفلام','مسلسلات','كوميديا','رياضة','ألعاب','قصص وألغاز','علوم'];let filter='الكل',onlyFav=false;let saved=[];try{saved=JSON.parse(localStorage.getItem('ps_beta_favs')||'[]')}catch(e){};const $=id=>document.getElementById(id);
function render(){const q=$('search').value.trim().toLowerCase();const shown=items.filter(x=>(filter==='الكل'||x.c===filter)&&(!onlyFav||saved.includes(x.id))&&(!q||(x.t+' '+x.c+' '+x.d).toLowerCase().includes(q)));$('heading').textContent=onlyFav?'المفضلة':filter==='الكل'?'اكتشف عوالم PulseSphere':filter;$('count').textContent=shown.length+' عناصر';$('chips').innerHTML=cats.map(c=>'<button class="chip '+(c===filter?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');$('cards').innerHTML=shown.map(x=>'<article class="card"><div class="poster" aria-hidden="true">'+x.e+'</div><div class="body"><small class="muted">'+x.c+'</small><h3>'+x.t+'</h3><p>'+x.d+'</p><button data-fav="'+x.id+'" aria-label="تبديل المفضلة">'+(saved.includes(x.id)?'♥ إزالة من المفضلة':'♡ أضف للمفضلة')+'</button></div></article>').join('')||'<p class="muted">لا توجد نتائج مطابقة.</p>';document.querySelectorAll('[data-cat],[data-filter]').forEach(b=>b.classList.toggle('active',(b.dataset.cat||b.dataset.filter)===filter));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat||b.dataset.filter){filter=b.dataset.cat||b.dataset.filter;onlyFav=false;render()}if(b.dataset.fav){const id=Number(b.dataset.fav);saved=saved.includes(id)?saved.filter(v=>v!==id):[...saved,id];localStorage.setItem('ps_beta_favs',JSON.stringify(saved));render()}});$('search').addEventListener('input',render);$('favorites').onclick=()=>{onlyFav=true;filter='الكل';render();$('cards').scrollIntoView({behavior:'smooth'})};$('home').onclick=()=>{onlyFav=false;filter='الكل';$('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})};$('explore').onclick=()=>$('cards').scrollIntoView({behavior:'smooth'});$('about').onclick=()=>alert('PulseSphere Beta: واجهة تجريبية قابلة للتصفح والبحث وحفظ المفضلة محليًا. الحسابات ورفع الفيديو والذكاء الاصطناعي الحقيقي ليست مفعلة بعد.');$('submit').onclick=()=>alert('رفع المحتوى غير متاح في هذه النسخة التجريبية بعد.');render();
</script></body></html>
