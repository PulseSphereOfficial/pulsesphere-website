<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseSphere — استوديو المبدعين</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#321653,#080a19 50%);color:#f8f5ff;font:16px/1.7 system-ui,Tahoma,sans-serif}header,main{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}a{color:#78e1ff}h1{font-size:clamp(28px,5vw,50px);margin-bottom:5px}.muted{color:#b5accd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#15112e;border:1px solid #63418b;border-radius:20px;padding:22px}label{display:block;margin:14px 0 5px}input,textarea,select{width:100%;background:#0b0d24;color:white;border:1px solid #655087;border-radius:12px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(110deg,#a337f7,#168ff0);color:white;font-weight:800;cursor:pointer}.secondary{background:#302349}.item{border:1px solid #49356b;border-radius:14px;padding:15px;margin:10px 0;overflow-wrap:anywhere}.item h3{margin:0}.tag{color:#71dcff;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border:1px solid #866e39;border-radius:12px;padding:12px;color:#f8dda1;background:#342a1c}#message{min-height:28px;color:#7df2bc}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>◉ PulseSphere</strong><a href="index.html">العودة إلى المنصة</a></header><main><h1>✨ استوديو المبدعين</h1><p class="muted">جهّز أعمالك الإبداعية واحتفظ بمسوداتها قبل النشر.</p><p class="notice">حفظ المسودة يُبقيها على جهازك. عند اختيار «نشر للجميع» يظهر عنوان العمل ووصفه ورابطه لزوار الموقع.</p><div class="grid"><section class="panel"><h2>مسودة جديدة</h2><form id="form"><label for="title">عنوان العمل</label><input id="title" required maxlength="100" placeholder="مثال: مغامرة في المستقبل"><label for="category">القسم</label><select id="category"><option>الأفلام</option><option>المسلسلات</option><option>الكوميديا</option><option>الرياضة</option><option>الألعاب</option><option>العلوم</option><option>القصص والألغاز</option></select><label for="description">وصف العمل</label><textarea id="description" maxlength="1000" required placeholder="اكتب فكرة المحتوى..."></textarea><label for="link">رابط معاينة اختياري (https)</label><input id="link" type="url" placeholder="https://example.com/video"><p><button type="submit">حفظ المسودة</button> <button type="button" disabled id="publishPublic">نشر للجميع</button> <a href="login.html" id="publishLogin">سجّل الدخول للنشر</a></p><div id="message" role="status" aria-live="polite"></div></form></section><section class="panel"><h2>مسوداتي <span id="count">0</span></h2><div class="actions"><button id="export" type="button" class="secondary">تصدير JSON</button><button id="clear" type="button" class="secondary">مسح المسودات</button></div><div id="drafts"></div></section></div></main><script>const KEY='pulsesphere_creator_drafts_v1';const form=document.querySelector('#form'),list=document.querySelector('#drafts'),message=document.querySelector('#message');function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[]}catch{return []}}let drafts=load();function persist(){try{localStorage.setItem(KEY,JSON.stringify(drafts));return true}catch{message.textContent='تعذر الحفظ: مساحة التخزين غير متاحة';return false}}function render(){list.replaceChildren();document.querySelector('#count').textContent=String(drafts.length);if(!drafts.length){const p=document.createElement('p');p.className='muted';p.textContent='لا توجد مسودات بعد.';list.append(p)}drafts.forEach(d=>{const el=document.createElement('article');el.className='item';const h=document.createElement('h3');h.textContent=d.title;const tag=document.createElement('div');tag.className='tag';tag.textContent=d.category;const p=document.createElement('p');p.textContent=d.description;el.append(h,tag,p);if(d.link){const a=document.createElement('a');a.textContent='فتح رابط المعاينة';a.href=d.link;a.target='_blank';a.rel='noopener noreferrer';el.append(a)}const del=document.createElement('p'),btn=document.createElement('button');btn.type='button';btn.className='secondary';btn.textContent='حذف';btn.onclick=()=>{drafts=drafts.filter(x=>x.id!==d.id);persist();render()};del.append(btn);el.append(del);list.append(el)})}form.addEventListener('submit',e=>{e.preventDefault();const title=document.querySelector('#title').value.trim(),description=document.querySelector('#description').value.trim(),category=document.querySelector('#category').value,link=document.querySelector('#link').value.trim();if(!title||!description){message.textContent='العنوان والوصف مطلوبان';return}if(link&&!/^https:\/\//i.test(link)){message.textContent='استخدم رابط HTTPS فقط';return}drafts.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title,description,category,link,createdAt:new Date().toISOString()});if(persist()){form.reset();message.textContent='تم حفظ المسودة على هذا الجهاز';render()}});document.querySelector('#clear').onclick=()=>{if(confirm('هل تريد حذف جميع المسودات المحلية؟')){drafts=[];persist();render()}};document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(drafts,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pulsesphere-drafts.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script><script type="module" src="community.js"></script></body></html>
