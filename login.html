<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b18"><title>PulseSphere — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1e1b4b,#070b18 55%);font:16px system-ui;color:#f8fafc;padding:20px}.box{width:min(400px,100%);padding:30px;border-radius:25px;background:#11172add;border:1px solid #334155;box-shadow:0 25px 70px #0008}.logo{text-align:center;font-size:36px;font-weight:900;margin-bottom:4px}.logo span{color:#22d3ee}.sub{text-align:center;color:#94a3b8;margin-bottom:25px}label{display:block;font-size:13px;color:#cbd5e1;margin:12px 2px 5px}input{width:100%;padding:14px;border:1px solid #334155;border-radius:13px;background:#070b18;color:white;outline:none}input:focus{border-color:#22d3ee}.actions{display:grid;gap:9px;margin-top:20px}button,.back{border:0;border-radius:13px;padding:13px;background:#8b5cf6;color:white;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.secondary{background:#172036;border:1px solid #334155}.message{min-height:24px;margin-top:13px;text-align:center;color:#fda4af;font-size:13px}.message.ok{color:#34d399}button:disabled{opacity:.55;cursor:wait}.note{font-size:12px;color:#64748b;text-align:center;margin-top:15px}</style></head><body><main class="box"><div class="logo">Pulse<span>Sphere</span></div><div class="sub">Secure beta access</div><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><div class="actions"><button id="login" type="submit">دخول / Login</button><button id="create" class="secondary" type="button">إنشاء حساب / Create account</button><a class="back secondary" href="index.html">← الصفحة الرئيسية / Home</a></div><div id="message" class="message" role="status" aria-live="polite"></div></form><div class="note">Firebase Authentication free tier • No payment required</div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const config={apiKey:'AIzaSyAmFp2IqVqL1Cju-Q6jjDD5QqAC5beHfvA',authDomain:'pulsesphere-5e804.firebaseapp.com',projectId:'pulsesphere-5e804',storageBucket:'pulsesphere-5e804.appspot.com',messagingSenderId:'525827306876',appId:'1:525827306876:web:dde3b95be7408dcf1620f9'};const auth=getAuth(initializeApp(config));const form=document.querySelector('#form'),msg=document.querySelector('#message'),login=document.querySelector('#login'),create=document.querySelector('#create');const values=()=>[document.querySelector('#email').value.trim(),document.querySelector('#password').value];function busy(on){login.disabled=on;create.disabled=on}function error(e){const map={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة / Invalid email or password','auth/email-already-in-use':'الحساب موجود بالفعل / Account already exists','auth/weak-password':'كلمة المرور ضعيفة / Password is too weak','auth/network-request-failed':'تحقق من الإنترنت / Check your connection'};msg.className='message';msg.textContent=map[e.code]||'تعذر إكمال العملية / Unable to complete the request'}async function run(createMode){if(!form.reportValidity())return;busy(true);msg.textContent='جارٍ الاتصال… / Connecting…';try{const[e,p]=values();if(createMode)await createUserWithEmailAndPassword(auth,e,p);else await signInWithEmailAndPassword(auth,e,p);msg.className='message ok';msg.textContent='تم بنجاح / Success';setTimeout(()=>location.href='index.html?signedIn=1',500)}catch(e){error(e)}finally{busy(false)}}form.onsubmit=e=>{e.preventDefault();run(false)};create.onclick=()=>run(true);
</script></body></html>
